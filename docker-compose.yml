# =============================================================================
# Team Health Check Docker Compose - Application Service Only
# Database must be provided externally (see docs/operations/docker.md for details)
# =============================================================================
#
# Ships as a single unified image (Go API + statically exported Next.js
# frontend + generated docs, all served from one port) built from the
# repository root Dockerfile -- there are no separate backend/frontend images.

services:
  # ---------------------------------------------------------------------------
  # Unified Application (API + Frontend)
  # ---------------------------------------------------------------------------
  teams360:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-guidewire-oss}/teams360:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teams360
    environment:
      # DATABASE_URL must be provided at runtime
      # Example: DATABASE_URL=postgres://user:pass@host:5432/dbname?sslmode=require
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
